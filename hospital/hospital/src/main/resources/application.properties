spring.application.name=hospital

spring.datasource.url=jdbc:postgresql://localhost:5432/hospital
spring.datasource.username=postgres
# password diisi lewat environment variable SPRING_DATASOURCE_PASSWORD

# Skema dikelola Flyway, Hibernate hanya memeriksa kecocokan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.admin.email=${ADMIN_EMAIL:admin@hospital.local}
app.admin.password=${ADMIN_PASSWORD:}